# Local Supabase CLI configuration for Tradutor.Ia.
# project_id is a LOCAL name only — never the remote project ref (which stays out of Git).
project_id = "tradutor-ia"

[db]
# Port used by the local `supabase start` Postgres (requires Docker; not run in this env).
port = 54322
major_version = 15

[db.migrations]
schema_paths = []

[test]
# `supabase test db` runs every *.sql under this folder as pgTAP (requires Docker).

# The update manifest contains public, signed metadata only. Its signature and hash are
# verified by the client; no Supabase JWT is required for a pre-login update check.
[functions.update-manifest]
verify_jwt = false
