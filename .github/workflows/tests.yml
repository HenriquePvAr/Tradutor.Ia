name: Hermetic Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    # The complete hermetic suite takes about 26 minutes on hosted Windows,
    # after dependency installation and collection. Keep time for diagnostics.
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-beta.txt
            requirements.txt
            requirements-rapidocr.txt
            requirements-dev.txt

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-beta.txt
          python -m pip install -r requirements-dev.txt

      # No requirements file can forbid a package, and pip does not report that
      # opencv-python and opencv-contrib-python ship the same `cv2` directory.
      - name: Check Beta runtime profile
        run: python scripts/check_runtime_profile.py

      - name: Confirm network smokes are disabled
        run: |
          $names = "ALLOW_NETWORK_TESTS", "ALLOW_WEBTOON_SMOKE", "ALLOW_NVIDIA_SMOKE"
          foreach ($name in $names) {
            $authorized = [Environment]::GetEnvironmentVariable($name) -eq "1"
            Write-Output "$name autorizado: $authorized"
            if ($authorized) {
              throw "Opt-in de smoke de rede não pode ser autorizado na CI."
            }
          }

      - name: Collect hermetic tests
        run: python -m pytest --collect-only -q

      - name: Run hermetic tests
        timeout-minutes: 50
        run: |
          $junitPath = Join-Path $env:RUNNER_TEMP "pytest-results.xml"
          python -m pytest -v --tb=short --durations=25 --junitxml="$junitPath"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-pytest-results-${{ github.run_id }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Check JavaScript syntax
        run: |
          node --check static/auth_provider.js
          node --check static/auth_ui.js
          node --check static/supabase_auth.js
          node --check static/social_community.js
          node --check static/tradutor_ui.js
          node --check static/i18n/index.js
          node --check static/i18n/pt-BR.js
          node --check static/i18n/en-US.js
          node --check static/i18n/es-ES.js
          node --check static/i18n/fr-FR.js
          node --check static/i18n/ja-JP.js
          node --check static/i18n/ko-KR.js

      - name: Install Better Auth service dependencies
        working-directory: apps/auth-service
        run: npm ci

      - name: Check Better Auth service
        working-directory: apps/auth-service
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Compile Python modules
        run: python -m compileall -q yomu test_support app_ui.py desktop_app.py down.py main.py run_local_folder.py run_webtoon.py start_tradutor.py worker_service.py conftest.py sitecustomize.py
