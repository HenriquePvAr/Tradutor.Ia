[pytest]
addopts = -m "not network and not manual"
# Collection must not walk the user's real run artifacts or runtime state (TDD #55).
# .local-audit holds untracked audit snapshots whose duplicate-basename copies would
# otherwise collide with the real test modules during import.
norecursedirs = output .cache .git .venv tmp node_modules __pycache__ .local-audit
markers =
    unit: teste unitário hermético
    integration: integração offline com fakes ou artefatos temporários
    network: requer rede real e opt-in explícito; excluído por padrão
    manual: smoke manual; excluído por padrão
    slow: teste lento, mas ainda hermético quando não marcado network
